# Host config for log-monitor — sourced by collect.sh / run.sh
HOST_LABEL="contabo2"
SSH_TARGET="rsi@100.77.125.40"
SSH_PORT="1789"
SSH_KEY="$HOME/.ssh/id_ed25519_comet"
PRIORITY_FLOOR="warning"
# UFW-blocked inbound packets from the open internet (port scans, etc.) — expected background
# noise for a public-facing box, not actionable. These are DROPPED connection attempts, not
# successful ones; a real compromise would show up via sshd/auth.log entries instead, which
# are not suppressed. Confirmed 2026-08-26 dominating the digest after fixing the
# adm/systemd-journal gap (see docs/2026-06-30_log-monitor.md).
#
# "Foreign process 'dockerd' changed sysctl .../eth0/disable_ipv6" — systemd 257 warns when a
# foreign process writes a sysctl networkd manages, but the path it receives is
# namespace-relative, so a container's own eth0 is indistinguishable from the host's. Every
# Docker network here is EnableIPv6=false, so dockerd disables IPv6 on each container's eth0
# at startup; the host's eth0 is never touched. Verified 2026-08-30: every running container
# reads disable_ipv6=1, the host reads 0, and networkd logged zero eth0 address changes.
# Fires ~every 2h from the notion_repeat compose cron. Present since 2026-02-26 — only became
# visible when the journal-group gap was fixed. See
# docs/2026-08-30_log-monitor_collect-sigpipe.md.
# Caveat: this would also hide a genuine dockerd change to the *host's* eth0. The log line
# cannot distinguish the two, so that trade is deliberate — the host-level symptom would be
# lost IPv6 connectivity, which surfaces elsewhere.
SUPPRESS_PATTERN="\[UFW BLOCK\]|Foreign process 'dockerd.*disable_ipv6"
