# Host config for log-monitor — sourced by collect.sh / run.sh
HOST_LABEL="raspberrypi2z"
SSH_TARGET="rsi@100.92.195.47"
SSH_PORT="22"
SSH_KEY="$HOME/.ssh/id_ed25519_comet"
PRIORITY_FLOOR="warning"
# Suppress known-normal patterns (grep -vE applied to aggregated journal lines).
# Same brcmfmac/wpa_supplicant cosmetic driver quirks confirmed benign on raspberrypi1
# (2026-07-03/04, AI triage rated notice/warning, no service impact); seen again here
# 2026-07-05 (FT + bgscan). Real disconnects (CTRL-EVENT-DISCONNECTED, deauthenticat,
# Link Down, no longer associated) are NOT suppressed and will still alert.
SUPPRESS_PATTERN="brcmf_p2p_send_action_frame|bgscan simple: Failed to enable signal strength|FT: Invalid key management type|brcmf_sdio_rxfail|brcmf_sdio_read_control"
