# Host config for log-monitor — sourced by collect.sh / run.sh
HOST_LABEL="gr-srv03"
SSH_TARGET="root@100.89.202.69"
SSH_PORT="22"
SSH_KEY="$HOME/.ssh/id_ed25519_comet"
# journalctl priority floor: collect this level and more severe (PRIORITY..emerg)
PRIORITY_FLOOR="warning"
# Suppress known-normal patterns (grep -vE applied to aggregated journal lines).
# BACKUP_A/B: rotating removable backup drives, unplugged for remote storage.
# 192.168.1.54: WDMyCloud NAS, reboots nightly causing CIFS reconnects.
# "own address as source": vmbr0 has a single port (enp2s0), stp off, so a local
# loop is impossible; confirmed 2026-07-02 as an isolated 2s/9-line burst with no
# recurrence — the aggregator's count-only digest made a one-off burst look like an
# ongoing loop to triage. Revisit if this starts recurring across multiple days.
# "write access unavailable, skipping orphan cleanup": expected ext4 message when
# vzdump mounts an LVM thin snapshot read-only during LXC snapshot-mode backups
# (dm-N reused per container, e.g. dm-15); confirmed 2026-07-06 against
# /var/log/vzdump/lxc-*.log — backups completed OK, snapshot cleaned up seconds later.
# "unable to get PID for CT 203": pvestatd polling during the ~2-3s window
# check-ceres-mount-sync.sh (cron 02:20) reboots ceres to refresh a stale bind
# mount; confirmed 2026-07-10, ceres came back up fine each time. remount-backup.sh
# sends its own Pushover alert if the remount/reboot actually fails.
# "auth key pair too old, rotating": routine pvestatd key rotation, expected maintenance.
SUPPRESS_PATTERN="BACKUP_A|backup_a|ef8a4442|BACKUP_B|backup_b|2d0b0d7c|192\.168\.1\.54|own address as source|write access unavailable, skipping orphan cleanup|unable to get PID for CT 203|auth key pair too old, rotating"
