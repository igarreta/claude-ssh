# Host config for log-monitor — sourced by collect.sh / run.sh
HOST_LABEL="gr-srv03"
SSH_TARGET="root@100.89.202.69"
SSH_PORT="22"
SSH_KEY="$HOME/.ssh/id_ed25519_comet"
# journalctl priority floor: collect this level and more severe (PRIORITY..emerg)
PRIORITY_FLOOR="warning"
# Suppress known-normal patterns (grep -vE applied to aggregated journal lines).
# BACKUP_B: rotating removable backup drive, absence is expected.
# 192.168.1.54: WDMyCloud NAS, reboots nightly causing CIFS reconnects.
SUPPRESS_PATTERN="BACKUP_B|backup_b|2d0b0d7c|192\.168\.1\.54"
