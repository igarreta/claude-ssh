# Host config for log-monitor — sourced by collect.sh / run.sh
HOST_LABEL="raspberrypi1"
SSH_TARGET="rsi@100.111.232.99"
SSH_PORT="22"
SSH_KEY="$HOME/.ssh/id_ed25519_comet"
PRIORITY_FLOOR="warning"
# Suppress known-normal patterns (grep -vE applied to aggregated journal lines).
# Broadcom brcmfmac/wpa_supplicant cosmetic driver quirks confirmed on 2026-07-03/04
# (AI triage rated notice/warning, no service impact): unhandled P2P probe frames,
# bgscan signal-monitoring config failure, FT (802.11r) roaming rejected by AP
# (falls back to normal auth), transient SDIO bus retries. Real disconnects
# (CTRL-EVENT-DISCONNECTED, deauthenticat, Link Down, no longer associated) are
# NOT suppressed and will still alert.
SUPPRESS_PATTERN="brcmf_p2p_send_action_frame|bgscan simple: Failed to enable signal strength|FT: Invalid key management type|brcmf_sdio_rxfail|brcmf_sdio_read_control"
